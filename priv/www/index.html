<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>velora viewer</title>
<link rel="icon" href="/assets/favicon.ico">
<link rel="stylesheet" href="/assets/vendor/leaflet.css">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div id="app">
  <div id="map"></div>

  <div id="empty">
    <div class="empty-card">
      <div class="empty-title">Drop a raster here</div>
      <div class="empty-sub">or open a file, paste a URL, or pick a sample</div>
    </div>
  </div>

  <div id="overlay" class="hidden">
    <div class="spinner"></div>
    <div id="ovtext">Processing…</div>
  </div>

  <section id="panel">
    <div class="brand"><span class="dot"></span> velora</div>

    <label class="filebtn" id="filebtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h6l2 3h8v11H4z"/></svg>
      Open image
      <input type="file" id="file" hidden>
    </label>
    <div id="fname" class="fname">no file selected</div>

    <div class="sep"><span>or</span></div>

    <input type="text" id="url" class="urlin" placeholder="https:// · s3:// URL — or a place name for NDVI">
    <button id="render" class="render">Render</button>
    <label class="ndvitoggle" title="Vegetation index: instant preview, then full resolution"><input type="checkbox" id="ndvi"> NDVI</label>
    <div id="status" class="status"></div>
    <div id="ndvistats" class="ndvistats hidden"></div>
	<br />
    <div class="samples">
      <button class="chip" data-uri="asset://samples/carina.jpg">🌌 Carina Nebula</button>
    </div>
  </section>
</div>
<script src="/assets/vendor/leaflet.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
