[package]
name = "velora_cache"
version = "0.1.0"
edition = "2021"
authors = ["Steve Roques <steve.roques@gmail.com>"]
description = "Bounded in-memory cache NIF for velora, backed by fulgurance"
license = "Apache-2.0"

[lib]
name = "velora_cache"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.37"
fulgurance = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
